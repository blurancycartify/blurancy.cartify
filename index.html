```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blurancy Cartify</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Blurancy Cartify</h1>
  <h2>Sign in with phone OTP</h2>

  <label for="phone">Phone number (India)</label>
  <input id="phone" type="tel" placeholder="+91XXXXXXXXXX">
  <div id="recaptcha-container"></div>
  <button id="send-otp">Send OTP</button>

  <label for="otp">Verification code</label>
  <input id="otp" inputmode="numeric" placeholder="Enter SMS code">
  <button id="verify-otp">Verify OTP</button>
  <p id="status" role="status"></p>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDXxVUR-T3GXmMd_PkJHKcDQb1Ygn_OFdg",
      authDomain: "blurancy-cartify.firebaseapp.com",
      projectId: "blurancy-cartify",
      storageBucket: "blurancy-cartify.firebasestorage.app",
      messagingSenderId: "96196985251",
      appId: "1:96196985251:web:b296bd3155b0dc73895a16",
      measurementId: "G-L7361GSVCW"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.useDeviceLanguage();

    let confirmationResult = null;
    let verifier = null;
    const status = document.getElementById("status");

    window.addEventListener("load", () => {
      verifier = new firebase.auth.RecaptchaVerifier(
        "recaptcha-container",
        { size: "normal" }
      );
      verifier.render().catch(error => {
        status.textContent = "reCAPTCHA error: " + error.message;
      });
    });

    document.getElementById("send-otp").addEventListener("click", async () => {
      const phone = document.getElementById("phone").value.trim();
      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        status.textContent = "Enter your full phone number with country code, e.g. +91XXXXXXXXXX.";
        return;
      }
      try {
        status.textContent = "Sending OTP...";
        confirmationResult = await auth.signInWithPhoneNumber(phone, verifier);
        status.textContent = "OTP sent. Check your SMS.";
      } catch (error) {
        status.textContent = "Could not send OTP: " + error.message;
        if (verifier) {
          verifier.clear();
          verifier = new firebase.auth.RecaptchaVerifier(
            "recaptcha-container", { size: "normal" }
          );
          verifier.render().catch(() => {});
        }
      }
    });

    document.getElementById("verify-otp").addEventListener("click", async () => {
      if (!confirmationResult) {
        status.textContent = "Please request an OTP first.";
        return;
      }
      const code = document.getElementById("otp").value.trim();
      try {
        const result = await confirmationResult.confirm(code);
        status.textContent = "Phone verified successfully!";
      } catch (error) {
        status.textContent = "Verification failed: " + error.message;
      }
    });
  </script>
</body>
</html>
