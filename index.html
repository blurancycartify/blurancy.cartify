
<section id="demo-otp" style="max-width:420px;margin:30px auto;padding:22px;border:1px solid #ddd;border-radius:16px;font-family:Arial,sans-serif;">
  <h2>Blurancy Cartify Login</h2>

  <p style="background:#fff3cd;color:#664d03;padding:12px;border-radius:8px;">
    <strong>DEMO ONLY</strong><br>
    No SMS is sent. This is not real phone verification.
  </p>

  <label for="demoPhone">Indian mobile number</label>
  <input id="demoPhone" type="tel" placeholder="+91 9876543210"
    autocomplete="tel"
    style="width:100%;padding:12px;margin:10px 0;box-sizing:border-box;">

  <button type="button" onclick="generateDemoOTP()"
    style="padding:12px;width:100%;cursor:pointer;">
    Generate Demo OTP
  </button>

  <div id="demoCodeArea" hidden>
    <label for="demoCode">Enter demo OTP</label>
    <input id="demoCode" type="text" inputmode="numeric"
      maxlength="6" placeholder="6-digit demo code"
      style="width:100%;padding:12px;margin:10px 0;box-sizing:border-box;">

    <button type="button" onclick="verifyDemoOTP()"
      style="padding:12px;width:100%;cursor:pointer;">
      Verify Demo OTP
    </button>
  </div>

  <p id="demoMessage" role="status" aria-live="polite"></p>
</section>

<script>
(() => {
  let demoCode = "";
  let expiresAt = 0;
  let verifiedPhone = "";

  window.generateDemoOTP = function () {
    const phone = document.getElementById("demoPhone").value
      .replace(/[\s()-]/g, "");
    const message = document.getElementById("demoMessage");

    verifiedPhone = "";
    demoCode = "";
    document.getElementById("demoCode").value = "";
    document.getElementById("demoCodeArea").hidden = true;

    if (!/^\+91[6-9]\d{9}$/.test(phone)) {
      message.textContent =
        "Enter a valid Indian number, for example +919876543210.";
      return;
    }

    demoCode = String(Math.floor(100000 + Math.random() * 900000));
    expiresAt = Date.now() + 5 * 60 * 1000;

    document.getElementById("demoCodeArea").hidden = false;

    // Demo only: code is shown on screen, never sent by SMS.
    message.textContent =
      "DEMO OTP: " + demoCode +
      ". No SMS sent. Code expires in 5 minutes.";
  };

  window.verifyDemoOTP = function () {
    const entered = document.getElementById("demoCode").value.trim();
    const message = document.getElementById("demoMessage");
    const phone = document.getElementById("demoPhone").value
      .replace(/[\s()-]/g, "");

    if (!demoCode || Date.now() > expiresAt) {
      demoCode = "";
      verifiedPhone = "";
      message.textContent = "Demo OTP expired. Generate a new code.";
      return;
    }

    if (entered !== demoCode) {
      message.textContent = "Incorrect demo OTP. Try again.";
      return;
    }

    verifiedPhone = phone;
    demoCode = "";
    message.textContent =
      "Demo verification successful for " + phone +
      ". This does not verify ownership of the phone number.";
  };
})();
</script>
