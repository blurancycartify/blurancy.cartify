
<!-- Blurancy Cartify OTP Login -->
<section id="bc-otp-login">
  <h2>Blurancy Cartify</h2>
  <p>Login with your mobile number</p>

  <label for="bc-phone">Mobile number</label>
  <input id="bc-phone" type="tel"
         placeholder="+919876543210" autocomplete="tel">
  <button id="bc-send" type="button">Send OTP</button>

  <div id="bc-verify-area" hidden>
    <label for="bc-code">Enter the OTP you received</label>
    <input id="bc-code" type="text" inputmode="numeric"
           maxlength="6" autocomplete="one-time-code"
           placeholder="6-digit OTP">
    <button id="bc-verify" type="button">Verify OTP</button>
  </div>

  <p id="bc-status" role="status" aria-live="polite"></p>
</section>

<style>
  #bc-otp-login {
    max-width: 420px;
    margin: 30px auto;
    padding: 24px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #fff;
    color: #222;
    font-family: Arial, sans-serif;
  }

  #bc-otp-login input,
  #bc-otp-login button {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin-top: 10px;
    border-radius: 7px;
    font-size: 16px;
  }

  #bc-otp-login input {
    border: 1px solid #bbb;
  }

  #bc-otp-login button {
    border: 0;
    background: #2874f0;
    color: white;
    cursor: pointer;
  }

  #bc-otp-login button:disabled {
    opacity: .6;
  }

  #bc-status {
    overflow-wrap: anywhere;
  }
</style>

<script>
(() => {
  const PROJECT_URL =
    "https://avfrwtvbbytyyoxoubjd.supabase.co";

  // Replace with your Supabase publishable key.
  const PUBLIC_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY";

  const endpoint = PROJECT_URL +
    "/functions/v1/minimoth-otp";

  const phone = document.getElementById("bc-phone");
  const code = document.getElementById("bc-code");
  const send = document.getElementById("bc-send");
  const verify = document.getElementById("bc-verify");
  const area = document.getElementById("bc-verify-area");
  const status = document.getElementById("bc-status");

  let requestedPhone = "";

  async function callFunction(action, otpCode) {
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": PUBLIC_KEY
      },
      body: JSON.stringify({
        action: action,
        phone: requestedPhone,
        ...(otpCode ? { code: otpCode } : {})
      })
    });

    const text = await response.text();
    let data = {};

    try {
      data = text ? JSON.parse(text) : {};
    } catch {
      data = {};
    }

    if (!response.ok) {
      if (response.status === 401) {
        throw new Error(
          "401 Unauthorized. Check the Supabase publishable key, " +
          "function authorization settings, and Edge Function logs."
        );
      }

      throw new Error(
        data.error || `Request failed: HTTP ${response.status}`
      );
    }

    return data;
  }

  send.addEventListener("click", async () => {
    requestedPhone = phone.value.trim();

    if (!/^\+[1-9]\d{7,14}$/.test(requestedPhone)) {
      status.textContent =
        "Enter your full number, e.g. +919876543210.";
      return;
    }

    send.disabled = true;
    status.textContent = "Requesting OTP…";

    try {
      await callFunction("send");
      area.hidden = false;
      status.textContent =
        "OTP request accepted. Check your SMS or WhatsApp.";
    } catch (error) {
      status.textContent = error.message;
    } finally {
      send.disabled = false;
    }
  });

  verify.addEventListener("click", async () => {
    const enteredCode = code.value.trim();

    if (!requestedPhone) {
      status.textContent = "Request an OTP first.";
      return;
    }

    if (!/^\d{6}$/.test(enteredCode)) {
      status.textContent = "Enter the 6-digit OTP.";
      return;
    }

    verify.disabled = true;
    status.textContent = "Verifying OTP…";

    try {
      const result = await callFunction("verify", enteredCode);

      if (!result.identity_id || !result.access_token) {
        status.textContent =
          "Response received, but verification session details are missing.";
        return;
      }

      status.textContent =
        "Phone verified successfully for Blurancy Cartify!";

      window.dispatchEvent(new CustomEvent(
        "blurancy:phone-verified",
        {
          detail: {
            phone: requestedPhone,
            identity_id: result.identity_id
          }
        }
      ));
    } catch (error) {
      status.textContent = error.message;
    } finally {
      verify.disabled = false;
    }
  });
})();
</script>
<!-- End Blurancy Cartify OTP Login -->
