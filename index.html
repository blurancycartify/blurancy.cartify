<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blurancy Cartify Real OTP Verification</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
    }
    .card h2 { color: #1a1a1a; margin-bottom: 0.5rem; font-size: 1.5rem; }
    .card p { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #333; }
    input[type="tel"], input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1.5px solid #dcdfe6;
      border-radius: 6px;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    .btn {
      width: 100%;
      padding: 0.85rem;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background-color: #1d4ed8; }
    .hidden { display: none; }
    .status-msg { font-size: 0.85rem; margin-top: 0.75rem; text-align: center; }
    .status-msg.error { color: #dc2626; }
    .status-msg.success { color: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    <!-- STEP 1: Phone Entry -->
    <div id="step-phone">
      <h2>Blurancy Cartify Login</h2>
      <p>Enter your phone number with country code (e.g., +1...)</p>
      <form id="phone-form">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="+1 234 567 8900" required />
        </div>
        <button type="submit" class="btn">Send Real OTP</button>
      </form>
    </div>

    <!-- STEP 2: OTP Entry -->
    <div id="step-otp" class="hidden">
      <h2>Enter Verification Code</h2>
      <p>Check your phone for the SMS text code.</p>
      <form id="otp-form">
        <div class="form-group">
          <label for="otp">6-Digit Code</label>
          <input type="text" id="otp" maxlength="6" placeholder="123456" required />
        </div>
        <button type="submit" class="btn">Verify Code</button>
      </form>
    </div>

    <!-- Invisible container required by Firebase for reCAPTCHA protection -->
    <div id="recaptcha-container"></div>
    <div id="status-msg" class="status-msg"></div>
  </div>

  <!-- Firebase App SDK Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // TODO: Replace with your actual Firebase project configuration dictionary
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
      projectId: "YOUR_FIREBASE_PROJECT_ID",
      storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
      messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const stepPhone = document.getElementById('step-phone');
    const stepOtp = document.getElementById('step-otp');
    const phoneForm = document.getElementById('phone-form');
    const otpForm = document.getElementById('otp-form');
    const phoneInput = document.getElementById('phone');
    const otpInput = document.getElementById('otp');
    const statusMsg = document.getElementById('status-msg');

    let confirmationResultGlobal = null;

    // Initialize invisible reCAPTCHA
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      'size': 'invisible'
    });

    // Send OTP action
    phoneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phoneNumber = phoneInput.value.trim();
      statusMsg.textContent = "Sending real SMS code...";
      statusMsg.className = "status-msg success";

      try {
        const appVerifier = window.recaptchaVerifier;
        confirmationResultGlobal = await signInWithPhoneNumber(auth, phoneNumber, appVerifier);
        
        stepPhone.classList.add('hidden');
        stepOtp.classList.remove('hidden');
        statusMsg.textContent = "OTP SMS sent successfully!";
      } catch (error) {
        statusMsg.textContent = error.message;
        statusMsg.className = "status-msg error";
      }
    });

    // Verify OTP action
    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = otpInput.value.trim();
      statusMsg.textContent = "Verifying code...";

      try {
        const result = await confirmationResultGlobal.confirm(code);
        const user = result.user;
        statusMsg.textContent = "Login successful! Welcome to Blurancy Cartify.";
        statusMsg.className = "status-msg success";
        // User is successfully authenticated here
      } catch (error) {
        statusMsg.textContent = "Invalid code. Please try again.";
        statusMsg.className = "status-msg error";
      }
    });
  </script>
</body>
</html>
