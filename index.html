<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Blurancy Cartify</title>

  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

<header class="topbar">

  <a class="brand" href="./">
    Blurancy Cartify
  </a>

  <form id="searchForm" class="search">
    <input
      id="searchInput"
      type="search"
      placeholder="Search products..."
      autocomplete="off"
    >
    <button type="submit">Search</button>
  </form>

  <div class="actions">
    <button id="loginBtn" type="button">Login</button>

    <button id="cartBtn" type="button">
      Cart (<span id="cartCount">0</span>)
    </button>
  </div>

</header>


<main>

  <section class="hero">
    <h1>Shop at Blurancy Cartify</h1>
    <p>
      100 products • Secure login • Cart • PayU checkout
    </p>
  </section>


  <section class="filters">

    <select id="categoryFilter">
      <option value="">All categories</option>
    </select>

    <input
      id="minPrice"
      type="number"
      min="0"
      placeholder="Min ₹"
    >

    <input
      id="maxPrice"
      type="number"
      min="0"
      placeholder="Max ₹"
    >

    <button id="clearFilters" type="button">
      Clear
    </button>

  </section>


  <section id="productGrid" class="grid"></section>

</main>


<!-- LOGIN MODAL -->

<div id="loginModal" class="modal hidden">

  <div class="modalbox">

    <button
      class="close"
      data-close="loginModal"
      type="button"
    >
      ×
    </button>

    <h2>Secure Phone Login</h2>

    <input
      id="phoneNumber"
      type="tel"
      placeholder="+91XXXXXXXXXX"
      inputmode="tel"
    >

    <button id="sendOtpBtn" type="button">
      Send OTP
    </button>

    <input
      id="otpCode"
      type="text"
      placeholder="6-digit OTP"
      inputmode="numeric"
      maxlength="6"
    >

    <button id="verifyOtpBtn" type="button">
      Verify OTP
    </button>

    <p id="authMessage"></p>

  </div>

</div>


<!-- CART MODAL -->

<div id="cartModal" class="modal hidden">

  <div class="modalbox wide">

    <button
      class="close"
      data-close="cartModal"
      type="button"
    >
      ×
    </button>

    <h2>Your Cart</h2>

    <div id="cartItems"></div>

    <div class="checkout">

      <h3>Checkout Details</h3>

      <input
        id="customerName"
        type="text"
        placeholder="Full name"
      >

      <input
        id="customerEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="customerPhone"
        type="tel"
        placeholder="Phone"
      >

      <input
        id="shippingAddress"
        type="text"
        placeholder="Delivery address"
      >

      <input
        id="shippingPin"
        type="text"
        placeholder="6-digit PIN"
        inputmode="numeric"
        maxlength="6"
      >

      <button id="payuBtn" type="button">
        Pay Securely with PayU
      </button>

      <p id="checkoutMessage"></p>

    </div>

  </div>

</div>


<footer>

  <p>
    © 2026 Blurancy Cartify
  </p>

  <p>
    Publish Privacy Policy, Terms, Refund/Return,
    Shipping and Contact pages before merchant launch.
  </p>

</footer>


<!-- SUPABASE CDN -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- YOUR APPLICATION -->

<script src="assets/app.js"></script>

</body>
</html>
