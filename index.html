
<!-- Blurancy Cartify - MiniMoth OTP Login -->
<section id="minimoth-login" style="max-width:400px;margin:24px auto;padding:20px;border:1px solid #ddd;border-radius:12px;font-family:Arial,sans-serif">
  <h2>Login with Phone OTP</h2>
  <p>Enter your Indian mobile number to receive an OTP.</p>

  <label for="mm-phone">Mobile number</label>
  <input id="mm-phone" type="tel" placeholder="9876543210"
    maxlength="13" autocomplete="tel"
    style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0">

  <button id="mm-send" type="button"
    style="padding:12px 18px;cursor:pointer">
    Send OTP
  </button>

  <div id="mm-verify-area" hidden>
    <label for="mm-code">Enter OTP</label>
    <input id="mm-code" type="text" inputmode="numeric"
      autocomplete="one-time-code" maxlength="6"
      placeholder="6-digit OTP"
      style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0">

    <button id="mm-verify" type="button"
      style="padding:12px 18px;cursor:pointer">
      Verify OTP
    </button>
  </div>

  <p id="mm-status" role="status" aria-live="polite"></p>
</section>

<script>
(() => {
  const FUNCTION_URL =
    "https://avfrwtvbbytyyoxoubjd.supabase.co/functions/v1/minimoth-otp";

  // Replace this placeholder with your Supabase public anon/publishable key.
  // Never put your MiniMoth live API key here.
  const SUPABASE_PUBLIC_KEY = "PASTE_YOUR_SUPABASE_PUBLIC_KEY_HERE";

  const phoneInput = document.getElementById("mm-phone");
  const codeInput = document.getElementById("mm-code");
  const verifyArea = document.getElementById("mm-verify-area");
  const status = document.getElementById("mm-status");
  const sendButton = document.getElementById("mm-send");
  const verifyButton = document.getElementById("mm-verify");

  async function callOtp(action, extra = {}) {
    const response = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLIC_KEY,
        "Authorization": "Bearer " + SUPABASE_PUBLIC_KEY
      },
      body: JSON.stringify({
        action,
        phone: phoneInput.value.trim(),
        ...extra
      })
    });

    const result = await response.json().catch(() => ({}));
    if (!response.ok || !result.ok) {
      throw new Error(result.error || "OTP request failed.");
    }
    return result;
  }

  sendButton.addEventListener("click", async () => {
    sendButton.disabled = true;
    status.textContent = "Sending OTP…";

    try {
      await callOtp("send");
      verifyArea.hidden = false;
      status.textContent =
        "OTP requested. Check your WhatsApp or SMS for the code.";
    } catch (error) {
      status.textContent = error.message;
    } finally {
      sendButton.disabled = false;
    }
  });

  verifyButton.addEventListener("click", async () => {
    verifyButton.disabled = true;
    status.textContent = "Verifying OTP…";

    try {
      await callOtp("verify", { code: codeInput.value.trim() });
      status.textContent =
        "Phone verified successfully. Connect this result to your login system.";
    } catch (error) {
      status.textContent = error.message;
    } finally {
      verifyButton.disabled = false;
    }
  });
})();
</script>
