```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blurancy Cartify</title>

    <link rel="stylesheet" href="assets/style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="header">
    <div class="brand">
        <h1>Blurancy Cartify</h1>
        <p>Your online shopping store</p>
    </div>

    <div class="header-actions">
        <button id="loginBtn">Login</button>
        <button id="cartBtn">
            Cart (<span id="cartCount">0</span>)
        </button>
    </div>
</header>

<main>

    <section class="hero">
        <h2>Welcome to Blurancy Cartify</h2>
        <p>Shop products at great prices.</p>

        <div class="search-box">
            <input
                type="search"
                id="searchInput"
                placeholder="Search products..."
            >
        </div>
    </section>

    <section class="products-section">
        <h2>Products</h2>

        <div id="loading">
            Loading products...
        </div>

        <div id="errorMessage" class="error"></div>

        <div id="productsGrid" class="products-grid"></div>
    </section>

</main>

<!-- Login Modal -->
<div id="loginModal" class="modal hidden">

    <div class="modal-content">

        <button id="closeLogin" class="close">×</button>

        <h2>Customer Login</h2>

        <input
            type="email"
            id="emailInput"
            placeholder="Enter your email"
        >

        <button id="sendOtpBtn">
            Send Login OTP
        </button>

        <input
            type="text"
            id="otpInput"
            placeholder="Enter OTP"
            maxlength="6"
        >

        <button id="verifyOtpBtn">
            Verify OTP
        </button>

        <p id="loginMessage"></p>

    </div>

</div>

<!-- Cart Modal -->
<div id="cartModal" class="modal hidden">

    <div class="modal-content">

        <button id="closeCart" class="close">×</button>

        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <div class="cart-total">
            Total:
            ₹<span id="cartTotal">0.00</span>
        </div>

        <button id="checkoutBtn">
            Checkout
        </button>

    </div>

</div>

<footer>
    <p>© 2026 Blurancy Cartify. All rights reserved.</p>
</footer>

<script src="app.js"></script>

</body>
</html>
```
