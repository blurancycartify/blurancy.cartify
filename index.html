
<!-- Blurancy Cartify: Real OTP Login -->
<section id="blurancy-otp" class="blurancy-otp">
  <h2>Blurancy Cartify Login</h2>
  <p>Sign in using your mobile number</p>

  <label for="bc-phone">Mobile number</label>
  <input
    id="bc-phone"
    type="tel"
    placeholder="+919876543210"
    autocomplete="tel"
  />

  <button id="bc-send-otp" type="button">Send OTP</button>

  <div id="bc-verify-section" hidden>
    <label for="bc-otp-code">Enter OTP</label>
    <input
      id="bc-otp-code"
      type="text"
      inputmode="numeric"
      maxlength="6"
      autocomplete="one-time-code"
      placeholder="6-digit OTP"
    />
    <button id="bc-verify-otp" type="button">Verify OTP</button>
  </div>

  <p id="bc-otp-status" role="status" aria-live="polite"></p>
</section>

<style>
  .blurancy-otp {
    max-width: 420px;
    margin: 30px auto;
    padding: 24px;
    border: 1px solid #ddd;
    border-radius: 14px;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #222;
  }

  .blurancy-otp h2 {
    margin-bottom: 8px;
  }

  .blurancy-otp label {
    display: block;
    margin-top: 16px;
    margin-bottom: 6px;
  }

  .blurancy-otp input {
    width: 100%;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 7px;
    box-sizing: border-box;
    font-size: 16px;
  }

  .blurancy-otp button {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    background: #2874f0;
    color: white;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
  }

  .blurancy-otp button:disabled {
    opacity: 0.6;
    cursor: wait;
  }
</style>

<script>
(() => {
  const PROJECT_REF = "avfrwtvbbytyyoxoubjd";
  const SUPABASE_PUBLIC_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY";

  const endpoint =
    `https://${PROJECT_REF}.supabase.co/functions/v1/minimoth-otp`;

  const phoneInput = document.getElementById("bc-phone");
  const codeInput = document.getElementById("bc-otp-code");
  const sendButton = document.getElementById("bc-send-otp");
  const verifyButton = document.getElementById("bc-verify-otp");
  const verifySection = document.getElementById("bc-verify-section");
  const status = document.getElementById("bc-otp-status");

  let requestedPhone = "";

  async function requestOtp(action, code) {
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLIC_KEY
      },
      body: JSON.stringify({
        action,
        phone: requestedPhone,
        ...(code ? { code } : {})
      })
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(result.error || `Request failed (${response.status})`);
    }

    return result;
  }

  sendButton.addEventListener("click", async () => {
    const phone = phoneInput.value.trim();

    if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
      status.textContent =
        "Enter your full number, e.g. +919876543210.";
      return;
    }

    requestedPhone = phone;
    sendButton.disabled = true;
    status.textContent = "Requesting OTP…";

    try {
      await requestOtp("send");
      verifySection.hidden = false;
      status.textContent =
        "OTP request accepted. Check your SMS or WhatsApp.";
    } catch (error) {
      status.textContent = error.message;
    } finally {
      sendButton.disabled = false;
    }
  });

  verifyButton.addEventListener("click", async () => {
    const code = codeInput.value.trim();

    if (!requestedPhone) {
      status.textContent = "Please request an OTP first.";
      return;
    }

    if (!/^\d{6}$/.test(code)) {
      status.textContent = "Enter the 6-digit OTP.";
      return;
    }

    verifyButton.disabled = true;
    status.textContent = "Verifying…";

    try {
      const result = await requestOtp("verify", code);

      if (!result.identity_id || !result.access_token) {
        status.textContent =
          "Provider response received, but no complete login session was returned.";
        return;
      }

      status.textContent = "Phone verified successfully!";
      window.dispatchEvent(new CustomEvent(
        "blurancy:phone-verified",
        { detail: { phone: requestedPhone, identity_id: result.identity_id } }
      ));
    } catch (error) {
      status.textContent = error.message;
    } finally {
      verifyButton.disabled = false;
    }
  });
})();
</script>
<!-- End Blurancy Cartify OTP Login -->
