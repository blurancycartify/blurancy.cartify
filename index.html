<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blurancy Cartify OTP Verification & Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
    }

    .card h2 {
      color: #1a1a1a;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    .card p {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #333;
    }

    input[type="tel"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1.5px solid #dcdfe6;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="tel"]:focus {
      border-color: #2563eb;
    }

    .otp-group {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .otp-input {
      width: 48px;
      height: 52px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
      border: 1.5px solid #dcdfe6;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .otp-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .btn:disabled {
      background-color: #a5b4fc;
      cursor: not-allowed;
    }

    .resend-box {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.85rem;
      color: #666;
    }

    .resend-btn {
      color: #2563eb;
      background: none;
      border: none;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    .resend-btn:disabled {
      color: #999;
      cursor: not-allowed;
      text-decoration: none;
    }

    .hidden {
      display: none;
    }

    .status-msg {
      font-size: 0.85rem;
      margin-top: 0.75rem;
      text-align: center;
    }
    .status-msg.error { color: #dc2626; }
    .status-msg.success { color: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- STEP 1: Phone Number Entry -->
    <div id="step-phone">
      <h2>Blurancy Cartify Login</h2>
      <p>Enter your mobile number to receive your Blurancy Cartify verification code.</p>
      
      <form id="phone-form">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="+1 234 567 8900" required autocomplete="tel" />
        </div>
        <button type="submit" id="send-otp-btn" class="btn">Send Verification Code</button>
      </form>
    </div>

    <!-- STEP 2: OTP Verification -->
    <div id="step-otp" class="hidden">
      <h2>Blurancy Cartify Verification</h2>
      <p>We sent a 6-digit code to <strong id="user-phone-display">+1 *** *** ****</strong></p>
      
      <form id="otp-form">
        <div class="otp-group">
          <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required />
          <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*" required />
          <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*" required />
          <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*" required />
          <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*" required />
          <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*" required />
        </div>

        <button type="submit" id="verify-btn" class="btn">Verify & Access Cartify</button>
      </form>

      <div class="resend-box">
        Didn't receive code? 
        <button id="resend-btn" class="resend-btn" disabled>Resend in <span id="timer">60</span>s</button>
      </div>
    </div>

    <div id="status-msg" class="status-msg"></div>
  </div>

  <script>
    const stepPhone = document.getElementById('step-phone');
    const stepOtp = document.getElementById('step-otp');
    const phoneForm = document.getElementById('phone-form');
    const otpForm = document.getElementById('otp-form');
    const phoneInput = document.getElementById('phone');
    const userPhoneDisplay = document.getElementById('user-phone-display');
    const otpInputs = document.querySelectorAll('.otp-input');
    const resendBtn = document.getElementById('resend-btn');
    const timerSpan = document.getElementById('timer');
    const statusMsg = document.getElementById('status-msg');

    let countdownTimer = null;
    let secondsLeft = 60;
    let currentPhoneNumber = "";

    // 1. Handle Phone Submission
    phoneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      currentPhoneNumber = phoneInput.value.trim();

      if (!currentPhoneNumber) return;

      showStatus("Sending Blurancy Cartify OTP...", "success");

      try {
        const response = await fetch('/api/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber: currentPhoneNumber })
        });
        const data = await response.json();
        if (!data.success) throw new Error(data.message || "Failed to send OTP");

        showStatus("", "");
        userPhoneDisplay.textContent = currentPhoneNumber;
        stepPhone.classList.add('hidden');
        stepOtp.classList.remove('hidden');
        otpInputs[0].focus();

        startResendTimer();
      } catch (err) {
        showStatus(err.message || "Failed to connect to server", "error");
      }
    });

    // 2. OTP Input Auto-Focus & Navigation
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;

        if (val && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = e.clipboardData.getData('text').trim();
        if (/^\d{6}\$/.test(pastedData)) {
          pastedData.split('').forEach((char, i) => {
            if (otpInputs[i]) otpInputs[i].value = char;
          });
          otpInputs[5].focus();
        }
      });
    });

    // 3. Handle OTP Code Verification Submission
    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const otpCode = Array.from(otpInputs).map(i => i.value).join('');

      if (otpCode.length !== 6) {
        showStatus("Please enter full 6-digit code.", "error");
        return;
      }

      showStatus("Verifying code...", "success");

      try {
        const response = await fetch('/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber: currentPhoneNumber, code: otpCode })
        });
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('authToken', data.token); 
          window.location.href = '/dashboard.html'; 
        } else {
          throw new Error(data.message || "Invalid verification code");
        }
      } catch (err) {
        showStatus(err.message || "Invalid OTP code. Try again.", "error");
      }
    });

    // 4. Timer Logic
    function startResendTimer() {
      secondsLeft = 60;
      resendBtn.disabled = true;
      timerSpan.textContent = secondsLeft;

      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        secondsLeft--;
        timerSpan.textContent = secondsLeft;

        if (secondsLeft <= 0) {
          clearInterval(countdownTimer);
          resendBtn.disabled = false;
          resendBtn.innerHTML = "Resend Code";
        }
      }, 1000);
    }

    resendBtn.addEventListener('click', () => {
      if (resendBtn.disabled) return;
      phoneForm.dispatchEvent(new Event('submit'));
    });

    function showStatus(msg, type) {
      statusMsg.textContent = msg;
      statusMsg.className = `status-msg ${type}`;
    }
  </script>
</body>
</html>
